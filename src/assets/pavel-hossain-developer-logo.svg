<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ICON EMBLEM -->
  <g transform="translate(4, 4)">
    <!-- Stylized P -->
    <path d="M 8,12 L 32,12 C 42,12 48,17 48,26 C 48,35 42,40 32,40 L 22,40 L 22,64 L 14,64 L 14,20 L 8,20 Z" 
          fill="url(#cyanGradient)" filter="url(#subtleGlow)" />
    <!-- P Inner Loop Cutout / Terminal Prompt >_ -->
    <path d="M 22,20 L 32,20 C 37,20 40,22 40,26 C 40,30 37,32 32,32 L 22,32 Z" fill="#020617" />
    <!-- >_ Inside P -->
    <path d="M 25,23 L 29,26 L 25,29" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <line x1="31" y1="29" x2="36" y2="29" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

    <!-- Stylized H -->
    <path d="M 44,12 L 52,12 L 52,28 L 62,28 L 62,12 L 70,12 L 70,64 L 62,64 L 62,36 L 52,36 L 52,64 L 44,64 Z" 
          fill="url(#cyanGradient)" filter="url(#subtleGlow)" />

    <!-- Code Brackets <> in H center -->
    <g transform="translate(50, 28)">
      <rect x="-2" y="0" width="18" height="10" fill="#020617" rx="1" />
      <path d="M 3,2 L 0,5 L 3,8" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <path d="M 11,2 L 14,5 L 11,8" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>

    <!-- Cyber Accents -->
    <path d="M 14,58 L 8,64 L 22,64" fill="#38bdf8" opacity="0.8" />
    <path d="M 62,58 L 70,64 L 52,64" fill="#38bdf8" opacity="0.8" />
  </g>

  <!-- TYPOGRAPHY: PAVEL HOSSAIN & SUBTITLE -->
  <g transform="translate(92, 0)">
    <text x="0" y="42" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-weight="900" 
          font-size="28" 
          letter-spacing="2.5" 
          fill="#22d3ee"
          style="text-transform: uppercase;">
      PAVEL HOSSAIN
    </text>

    <text x="1" y="62" 
          font-family="ui-monospace, SFMono-Regular, monospace" 
          font-weight="600" 
          font-size="11.5" 
          letter-spacing="3.2" 
          fill="#94a3b8"
          style="text-transform: uppercase;">
      FULL-STACK &amp; SYSTEMS DEVELOPER
    </text>
  </g>
</svg>
